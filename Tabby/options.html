<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title data-i18n="optionsTitle">Tabby option</title>
  <link rel="stylesheet" href="style/options.css">
</head>
<body>
  <div id="header">
    <h1 data-i18n="mainTitle">Tabby</h1>
    <img src="icon.png" alt="Logo" />
  </div>
  
  <div id="main">

    <div id="open-tabs">
      <h2 data-i18n="openTabsHeader">Open Tabs</h2>
      <ul id="tab-list" class="dropzone"></ul>
    </div>

    <div id="groups">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
        <h2 data-i18n="groupsHeader">Groups</h2>
        <div style="display:flex; gap:8px; align-items:center;">
          <input id="group-search" type="search" placeholder="Search groups…" />
          <select id="group-sort" class="select-pill">
            <option value="alpha-asc">A → Z</option>
            <option value="alpha-desc">Z → A</option>
            <option value="size-desc">Largest</option>
            <option value="size-asc">Smallest</option>
          </select>
        </div>
      </div>
      <ul id="group-list" class="dropzone"></ul>
      <div style="display: flex;">
        <input id="new-group-name" type="text" data-i18n-placeholder="newGroupPlaceholder" placeholder="New group name" />
        <button id="create-group" data-i18n="createGroupButton">+ Create Group</button>
      </div>
    </div>

    <div id="folders">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
        <h2 data-i18n="foldersHeader">Folders</h2>
        <div style="display:flex; gap:8px; align-items:center;">
          <input id="folder-search" type="search" placeholder="Search folders…" />
          <select id="folder-sort" class="select-pill">
            <option value="alpha-asc">A → Z</option>
            <option value="alpha-desc">Z → A</option>
            <option value="size-desc">Most groups</option>
            <option value="size-asc">Fewest groups</option>
          </select>
        </div>
      </div>
      <ul id="folder-list" class="dropzone"></ul>
      <div style="display: flex;">
        <input id="new-folder-name" type="text" data-i18n-placeholder="newFolderPlaceholder" placeholder="New folder name" />
        <button id="create-folder" data-i18n="createFolderButton">+ Create Folder</button>
      </div>
    </div>

    

  </div>

  <div id="footer">
    <h3 data-i18n="footerTitle">Tabby - Double v3.2.1</h3>
    <h3 data-i18n="footerDesc">A tab orginizing tool to keep ur browser orginized and ur ram happy</h3>
    <h5 data-i18n="footerCredit">art made by Lyna</h5>
    <!-- Backup / Import (kept where you placed it) -->
    <div id="backup" style="flex-basis:100%; margin-top: 10px;">
      <h2>Backup &amp; Import</h2>
      <div class="backup-actions">
        <button id="export-backup">Export backup</button>
        <button id="import-backup">Import backup</button>
        <input id="import-file" type="file" accept=".json,application/json" style="display:none" />
        <small>(Download or restore a JSON backup)</small>
      </div>
    </div>
  </div>

  <script type="module" src="src/ui/options.js"></script>
  <script type="module" src="src/ui/importExport.js"></script>
  <script type="module" src="src/ui/ui-render.js"></script>
</body>
</html>
